# Denormalize four tables and transform column names to column names in master table. It also does period timestamp conversion.
sql: "@format CREATE OR REPLACE TEMPORARY VIEW sp_view_tps_so_za_master AS
      SELECT
        f.DistributorID AS distributor_number,
        d.DistributorName AS distributor_name,
        f.BuyerID AS customer_number,
        b.BuyerName AS customer_name,
        string(string(NULL)) AS customer_name2,
        f.SKUCode AS product_code,
        s.MaterialDesc AS product_description,
        to_timestamp(f.UploadDate, 'yyyy/MM/dd') AS period_start,
        to_timestamp(date_add(period_start, 1)) AS period_end,
        year(period_start) AS period_year,
        'KG' AS uom,
        FLOAT(f.SoldCases) AS amount,
        'ZA' AS country_code,
        string(string(NULL)) AS street1,
        string(NULL) AS street2,
        string(NULL) AS city,
        b.Region AS province,
        string(NULL) AS postal_code,
        string(NULL) AS ma_name,
        string(NULL) AS parent_account,
        string(NULL) AS segment,
        string(NULL) AS sub_segment,
        string(NULL) AS sector,
        string(NULL) AS distributor_classification,
        f.RecordID AS record_id,
        f.UploadDate AS upload_date,
        f.SoldValue AS sold_value,
        f.SoldVolumeKG AS sold_volume_kg,
        f.SoldUnits AS sold_units,
        f.TransactionDateID AS transaction_date_id,
        d.Distribution_Frequency AS distribution_frequency,
        b.GPSLat AS gps_lat,
        b.GPSLong AS gps_long,
        b.Environment AS environment,
        b.SubEnvironment AS sub_environment,
        b.CuisineType AS cuisine_type,
        s.Brand AS brand,
        s.BrandGroup AS brand_group,
        s.BrandType AS brand_type,
        s.Category AS category,
        s.Division AS division,
        s.Ean AS ean,
        s.Family AS family,
        s.InnovationType AS innovation_type,
        s.SubBrand AS sub_brand,
        s.SubCategory AS sub_category,
        s.SubFamily AS sub_family,
        s.VolumeKG AS volume_kg,
        s.CaseConfiguration AS case_configuration,
        s.CaseKGVolume AS case_kg_volume,
        s._raw_file_name,
        s._batch_id,
        'Yes' as test
      FROM {env[MFL_CAT_MFL_BRONZE]}.external_files.mfl_tps_so_za_fact_sales f
      JOIN sp_view_tps_so_distributor d ON f.DistributorID=d.DistributorID
      JOIN sp_view_tps_so_buyer b on f.BuyerID=b.BuyerID
      JOIN sp_view_tps_so_product s on f.SKUCode=s.SKUCode"
