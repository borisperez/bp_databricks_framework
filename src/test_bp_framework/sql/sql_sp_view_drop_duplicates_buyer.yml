sql: "@format CREATE OR REPLACE TEMPORARY VIEW sp_view_tps_so_buyer AS
        SELECT
          *
        FROM
        (
          SELECT
            *,
            ROW_NUMBER() OVER (PARTITION BY BuyerID ORDER BY BuyerName) AS row_num
          FROM
            {env[MFL_CAT_MFL_BRONZE]}.external_files.mfl_tps_so_za_dim_buyer
        ) AS subquery
        WHERE row_num = 1"